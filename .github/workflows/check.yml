name: BugBounty Monitor

on:
  schedule:
    # -------------------------------------------------------------
    # CUSTOMIZE FREQUENCY HERE:
    # '0 * * * *'      = Every Hour (Default)
    # '*/30 * * * *'   = Every 30 Minutes
    # '*/15 * * * *'   = Every 15 Minutes
    # -------------------------------------------------------------
    - cron: '*/15 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual run

permissions:
  contents: write # Required to push state.json back to the repo

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Radar Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: python radar.py

      - name: Commit and Push State Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json
          git commit -m "Update state from workflow" || exit 0
          git push
